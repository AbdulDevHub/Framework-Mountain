<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWA Notes</title>
  <meta name="description" content="A tiny offline-first notes app that demonstrates core Progressive Web App concepts." />

  <!-- theme-color: tints the browser UI (address bar on Android, title bar when installed) -->
  <meta name="theme-color" content="#4f46e5" />

  <!-- Links the manifest so the browser knows this page is "installable" -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS doesn't fully support the manifest spec, so it needs its own tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PWA Notes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>📝 PWA Notes</h1>
      <span id="status-pill" class="pill pill-online">online</span>
    </header>

    <p id="install-banner" class="install-banner hidden">
      Install this app on your device for offline, full-screen use.
      <button id="install-btn">Install</button>
      <button id="dismiss-btn" class="ghost">Not now</button>
    </p>

    <form id="note-form" class="note-form">
      <input id="note-input" type="text" placeholder="Write a note and hit enter…" autocomplete="off" required />
      <button type="submit">Add</button>
    </form>

    <ul id="note-list" class="note-list"></ul>

    <footer class="app-footer">
      <span id="sw-status">checking service worker…</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
